---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: autobrr-qui
  namespace: media-server
spec:
  image: ghcr.io/autobrr/qui
  interval: 1h
---
# Fork build with the Space Management feature (almarzn/qui).
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: almarzn-qui
  namespace: media-server
spec:
  image: ghcr.io/almarzn/qui
  interval: 10m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: qui
  namespace: media-server
spec:
  # Temporarily pinned to pr-2: the fork's Release workflow can't publish
  # "develop" while upstream's TestTransferResumesAfterARestart race fails, so
  # the redesign was built by "Build PR image" from almarzn/qui#2 (develop @
  # d2e5899e). Switch the pattern back to '^develop$' once develop builds.
  # Normally tracks the fork's "develop" image (upstream develop plus Space
  # Management, built by the fork's Release workflow on each push to develop)
  # by digest, so a rebuild of the tag rolls out.
  # To go back to upstream releases, point this at autobrr-qui and restore:
  #   filterTags: {pattern: '^(?:v)?(?P<ver>\d+\.\d+\.\d+)', extract: '$ver'}
  #   policy: {semver: {range: '^1.11.0'}}
  imageRepositoryRef:
    name: almarzn-qui
  digestReflectionPolicy: Always
  interval: 10m
  filterTags:
    pattern: '^pr-2$'
  policy:
    alphabetical:
      order: asc
