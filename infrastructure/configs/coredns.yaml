apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  yggtorrent.server: |-
    # Include specific server zone
    yggtorrent.top. {
      errors
      forward . 9.9.9.9
    }
  upstream.override: |-
    # Default upstream DNS. Quad9 (9.9.9.9 / 149.112.112.112) times out from this network.
    forward . 1.1.1.1 8.8.8.8
